services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:10000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # http://localhost:4200
      - "4200:80"
    depends_on:
      - backend

  ollama:
      image: ollama/ollama
      volumes:
        - ollama_data:/root/.ollama
      ports:
        - "11434:11434"

volumes:
  ollama_data: