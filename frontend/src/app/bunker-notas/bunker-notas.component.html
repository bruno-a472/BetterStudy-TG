<div class="header"></div>
<div class="tela-inteira" *ngIf="visualizacao">
    <div class="cabecalho">
        <div class="logo-box">
            <img class="logo-imagem" src="logo.png"/>
            <h1 class="logo-texto">BetterStudy</h1>
        </div>
        <p class="saudacao">Olá, {{nome}}!</p>
    </div>    
    <router-outlet></router-outlet>
    <div class="painel-ia" *ngIf="visualizacao">
        <div class="espaco-ia">
            <div class="espaco-ia-titulo">Assistente de Estudos</div>
            <app-chat></app-chat>
        </div>
    </div>

    <form class="login">
        <button class="login-botao" type="button" (click)="limparCacheNotas()">Limpar cache</button>
        <button class="login-botao" type="button" (click)="testarChat()">Iniciar chat</button>
    </form>
</div>
