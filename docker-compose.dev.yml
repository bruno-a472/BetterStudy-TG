services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - OLLAMA_URL=http://ollama:11434/api/generate
    volumes:
      - ./backend:/app
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # http://localhost:4200
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  ollama:
      image: ollama/ollama
      volumes:
        - ollama_data:/root/.ollama
      ports:
        - "11434:11434"

volumes:
  ollama_data: